name: zizmor

on:
  pull_request:
    # synchronize reruns the scan whenever commits are pushed to an open PR
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions: {}

# cancel a still-running scan of the same PR (or branch, for manual runs)
# when a newer one starts
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: Scan GitHub Actions
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout the repository to scan its workflows
      pull-requests: write # create/update the findings comment on PRs

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Keep this workflow self-contained: it is distributed to other repos.
      - name: Install scanner
        run: |
          python3 -m venv "${RUNNER_TEMP}/zizmor-venv"
          # Approved Linux x86_64 wheel hashes from the pinned PyPI releases.
          # Keep these in the source workflow for centralized ruleset runs.
          # Update package versions and hashes together; never fetch hashes at runtime.
          cat > "${RUNNER_TEMP}/zizmor-requirements.txt" <<'REQUIREMENTS'
          zizmor==1.30.1 \
              --hash=sha256:eee12266b793cb87ad4a7e3af2e72404f8a63e3de5eb099b80bf7b1cfd232a8e
          PyYAML==6.0.3 \
              --hash=sha256:22ba7cfcad58ef3ecddc7ed1db3409af68d023b7f940da23c6c2a1890976eda6 \
              --hash=sha256:9c7708761fccb9397fe64bbc0395abcae8c4bf7b0eac081e12b809bf47700d0b \
              --hash=sha256:b8bb0864c5a28024fac8a632c443c87c5aa6f215c0b126c449ae1a150412f31d \
              --hash=sha256:ba1cc08a7ccde2d2ec775841541641e4548226580ab850948cbfda66a1befcdc \
              --hash=sha256:0f29edc409a6392443abf94b9cf89ce99889a1dd5376d94316ae5145dfedd5d6 \
              --hash=sha256:c458b6d084f9b935061bc36216e8a69a7e293a2f1e68bf956dcd9e6cbcd143f5 \
              --hash=sha256:00c4bdeba853cc34e7dd471f16b4114f4162dc03e6b7afcc2128711f0eca823c \
              --hash=sha256:0150219816b6a1fa26fb4699fb7daa9caf09eb1999f3b70fb6e786805e80375a
          REQUIREMENTS
          "${RUNNER_TEMP}/zizmor-venv/bin/pip" install \
            --require-hashes --only-binary=:all: \
            -r "${RUNNER_TEMP}/zizmor-requirements.txt"

      - name: Scan with audit exception fallback
        id: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          "${RUNNER_TEMP}/zizmor-venv/bin/python" - <<'PYEOF'
          import copy
          import json
          import os
          from pathlib import Path
          import re
          import shutil
          import subprocess
          import tempfile
          import uuid
          import yaml

          temp = Path(os.environ["RUNNER_TEMP"])
          scanner = temp / "zizmor-venv/bin/zizmor"
          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          raw = temp / "zizmor"
          warnings_path = temp / "zizmor-fallbacks.json"
          raw.write_text("")
          warnings = []
          warnings_path.write_text("[]")
          failure = re.compile(r"'([a-z0-9-]+)' audit failed on file://([^\r\n]+)")
          status = 0

          def scan(root, target, config=None):
              args = [str(scanner), "--format=github", "--color=never", "--persona=regular"]
              if config:
                  args += ["--config", str(config)]
              result = subprocess.run(args + ["--", target], cwd=root,
                                      capture_output=True, text=True)
              # Fatal diagnostics can contain repository-controlled text.
              # Only completed scan output is interpreted as annotations.
              token = uuid.uuid4().hex
              print(f"::stop-commands::{token}", flush=True)
              print(result.stderr, end="", flush=True)
              if result.returncode == 1:
                  print(result.stdout, end="", flush=True)
              print(f"::{token}::", flush=True)
              return result

          def record(result):
              global status
              if result.returncode in (0, 3, 10, 11, 12, 13, 14):
                  with raw.open("a") as output:
                      output.write(result.stdout)
                  print(result.stdout, end="", flush=True)
                  if result.returncode not in (0, 3) and status == 0:
                      status = result.returncode
              else:
                  status = 1

          def crashed_input(result, root):
              if result.returncode != 1:
                  return None
              match = failure.search(result.stderr)
              if not match:
                  return None
              rule, name = match.groups()
              path = (root / name).resolve()
              if not path.is_relative_to(root) or not path.is_file():
                  return None
              return rule, path.relative_to(root).as_posix()

          def base_config(path):
              # Match v1.30.1's Git-root configuration discovery order.
              parent = workspace / Path(path).parent
              git = subprocess.run(["git", "-C", str(parent), "rev-parse", "--show-toplevel"],
                                   capture_output=True, text=True, check=True)
              root = Path(git.stdout.strip())
              for name in (".github/zizmor.yml", ".github/zizmor.yaml", "zizmor.yml", "zizmor.yaml"):
                  candidate = root / name
                  if candidate.is_file():
                      return yaml.safe_load(candidate.read_text()) or {}
              return {}

          def warn(rule, path):
              warnings.append({"rule": rule, "file": path})
              warnings_path.write_text(json.dumps(warnings))
              message = f"⚠️ Audit {rule} could not be completed for {path}; retrying with this audit disabled for this file only. Scan coverage is reduced."
              message = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::warning::{message}", flush=True)

          # Let zizmor collect inputs itself. On failure, isolate that file in
          # a disposable copy, then rerun collection for all remaining inputs.
          # Never modify checked-out files or suppress this audit repo-wide.
          with tempfile.TemporaryDirectory(dir=temp) as directory:
              root = (Path(directory) / "repository").resolve()
              shutil.copytree(workspace, root, symlinks=True)
              isolated = {}
              while True:
                  result = scan(root, ".")
                  crashed = crashed_input(result, root)
                  if not crashed:
                      record(result)
                      break
                  rule, path = crashed
                  isolated[path] = rule
                  (root / path).unlink()

              for path, first_rule in isolated.items():
                  config = copy.deepcopy(base_config(path))
                  disabled = set()
                  rule = first_rule
                  while True:
                      if rule in disabled:
                          status = 1
                          break
                      disabled.add(rule)
                      config.setdefault("rules", {}).setdefault(rule, {})["disable"] = True
                      config_path = Path(directory) / "fallback.yml"
                      config_path.write_text(yaml.safe_dump(config))
                      warn(rule, path)
                      result = scan(workspace, path, config_path)
                      crashed = crashed_input(result, workspace)
                      if not crashed or crashed[1] != path:
                          record(result)
                          break
                      rule = crashed[0]
          # Findings fail the job but still represent a completed scan.
          # If the wrapper raises unexpectedly, this output stays unset so the
          # report treats the failed step as a scanner error.
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("scan_completed={}\n".format("false" if status == 1 else "true"))
          raise SystemExit(status)
          PYEOF

      # The same report is used for both the Action Summary and PR comment.
      - name: Build findings report
        id: report
        if: ${{ !cancelled() }}
        env:
          ZIZMOR_OUTCOME: ${{ steps.zizmor.outcome }}
          SCAN_COMPLETED: ${{ steps.zizmor.outputs.scan_completed }}
          # commit the findings refer to: the PR head for pull_request runs,
          # the pushed/dispatched commit otherwise
          LINK_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 - <<'PYEOF'
          import glob
          import json
          import os
          import re
          from urllib.parse import quote

          raw_path = os.path.join(os.environ["RUNNER_TEMP"], "zizmor")
          outcome = os.environ["ZIZMOR_OUTCOME"]
          repo_url = "{}/{}".format(
              os.environ["GITHUB_SERVER_URL"], os.environ["GITHUB_REPOSITORY"]
          )
          run_url = "{}/actions/runs/{}".format(repo_url, os.environ["GITHUB_RUN_ID"])
          # permalink base for the exact commit that was scanned, so the line
          # numbers in the findings keep pointing at the right code
          blob_url = "{}/blob/{}".format(repo_url, os.environ["LINK_SHA"])
          commit_url = "{}/commit/{}".format(repo_url, os.environ["LINK_SHA"])
          DOCS_URL = "https://docs.zizmor.sh/audits/"

          MARKER = "<!-- zizmor-findings-report -->"
          MAX_ROWS = 50
          ANSI = re.compile(r"\x1b\[[0-9;]*[A-Za-z]")
          # ::error file=x.yml,line=3,title=some-audit::message
          CMD = re.compile(r"^::(error|warning|notice)\s+(.*?)::(.*)$")

          def unescape(s, prop=False):
              if prop:
                  s = s.replace("%3A", ":").replace("%2C", ",")
              return s.replace("%0D", "\r").replace("%0A", "\n").replace("%25", "%")

          def cell(s):
              s = s.replace("|", "\\|").replace("\r", "").replace("\n", "<br>")
              return s if len(s) <= 300 else s[:297] + "..."

          # Mirrors zizmor's default input collection, for report wording only:
          # zizmor prints "no inputs collected" to stderr, which the wrapper does
          # not tee into raw_path, so an empty raw_path alone cannot tell
          # "nothing found" from "nothing to scan". The job outcome is driven
          # solely by zizmor's exit code, never by this check.
          def count_auditable_inputs():
              patterns = [
                  os.path.join(".github", "workflows", "*.yml"),
                  os.path.join(".github", "workflows", "*.yaml"),
                  os.path.join("**", "action.yml"),
                  os.path.join("**", "action.yaml"),
                  os.path.join(".github", "dependabot.yml"),
                  os.path.join(".github", "dependabot.yaml"),
                  ".pre-commit-config.yaml",
              ]
              found = [p for pat in patterns for p in glob.glob(pat, recursive=True)]
              return len([p for p in found if not p.startswith(".git" + os.sep)])

          fallback_path = os.path.join(os.environ["RUNNER_TEMP"], "zizmor-fallbacks.json")
          fallbacks = []
          if os.path.exists(fallback_path):
              with open(fallback_path, encoding="utf-8") as f:
                  fallbacks = json.load(f)

          findings = []
          if os.path.exists(raw_path):
              with open(raw_path, encoding="utf-8", errors="replace") as f:
                  for line in f:
                      m = CMD.match(ANSI.sub("", line.strip()))
                      if not m:
                          continue
                      level, props_raw, message = m.groups()
                      props = {}
                      for kv in props_raw.split(","):
                          if "=" in kv:
                              k, v = kv.split("=", 1)
                              props[k.strip()] = unescape(v, prop=True)
                      # message starts with "<filename>:<line>: ", already covered
                      # by the Location column
                      message = re.sub(r"^[^:]+:\d+:\s*", "", unescape(message))
                      findings.append((level, props, message))

          lines = [MARKER, "## 🌈 zizmor scan results", ""]
          # "nothing to scan" only goes to the run summary, not to a PR comment
          skip_comment = False
          if fallbacks:
              lines += ["⚠️ **Scan coverage is reduced.** Some checks could not be completed by the scanner and were skipped for the entire files listed below. This does not indicate a failed security check:", ""]
              rules_by_file = {}
              for fallback in fallbacks:
                  rules_by_file.setdefault(fallback["file"], []).append(fallback["rule"])
              for path, rules in rules_by_file.items():
                  lines.append("- `{}` ({})".format(
                      cell(path), ", ".join("`{}`".format(cell(rule)) for rule in rules)))
              lines += ["", "See the [workflow run log]({}) for details.".format(run_url), ""]
          if findings:
              lines.append(
                  "❌ zizmor found **{}** finding(s) in this repository's "
                  "GitHub Actions.".format(len(findings))
              )
              lines += ["", "| Severity | Check | Location | Details |", "|---|---|---|---|"]
              icons = {"error": "🔴 error", "warning": "🟡 warning", "notice": "🔵 notice"}
              for level, props, message in findings[:MAX_ROWS]:
                  check = props.get("title", "?")
                  check_cell = "`{}`".format(check)
                  # audit names are the anchors on the docs page
                  if re.fullmatch(r"[a-z0-9-]+", check):
                      check_cell = "[`{}`]({}#{})".format(check, DOCS_URL, check)

                  path = props.get("file", "")
                  line_no = props.get("line", "")
                  end_line = props.get("endLine", "")
                  loc = (path or "?") + (":" + line_no if line_no else "")
                  loc_cell = "`{}`".format(loc)
                  if path:
                      target = "{}/{}".format(blob_url, quote(path))
                      if re.fullmatch(r"\d+", line_no):
                          target += "#L" + line_no
                          if re.fullmatch(r"\d+", end_line) and end_line != line_no:
                              target += "-L" + end_line
                      loc_cell = "[`{}`]({})".format(loc, target)

                  lines.append("| {} | {} | {} | {} |".format(
                      icons[level], check_cell, loc_cell, cell(message)))
              if len(findings) > MAX_ROWS:
                  lines.append("")
                  lines.append("...and {} more finding(s), see the run log.".format(
                      len(findings) - MAX_ROWS))
              lines += [
                  "",
                  "🔎 Full details: [workflow run log]({}) — on pull requests the "
                  "findings also appear as inline annotations in the "
                  "**Files changed** tab. Each check links to its [audit "
                  "documentation]({}), each location to the offending line at "
                  "commit [`{}`]({}).".format(
                      run_url, DOCS_URL, os.environ["LINK_SHA"][:7], commit_url),
              ]
          elif outcome == "success" and not fallbacks and count_auditable_inputs() == 0:
              skip_comment = True
              lines.append(
                  "ℹ️ Nothing to scan: this repository has no GitHub Actions "
                  "workflows, action definitions or Dependabot configs."
              )
          elif outcome == "success":
              lines.append("⚠️ Remaining checks found no issues; the skipped audits above were not evaluated." if fallbacks else "✅ zizmor found no issues in this repository's GitHub Actions.")
          else:
              lines.append(
                  "⚠️ The zizmor scan did not complete successfully (no findings "
                  "were reported). Check the [workflow run log]({}) for the "
                  "error.".format(run_url)
              )
          if findings and outcome != "success" and os.environ.get("SCAN_COMPLETED") != "true":
              lines += ["", "⚠️ The scan could not complete due to a scanner error. Findings above may be incomplete; see the [workflow run log]({}).".format(run_url)]
          lines.append("")

          report = "\n".join(lines)
          with open(os.path.join(os.environ["RUNNER_TEMP"], "zizmor-report.md"), "w",
                    encoding="utf-8") as f:
              f.write(report)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write(report)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write("skip_comment={}\n".format("true" if skip_comment else "false"))
          PYEOF

      # Creates the report comment on the PR, or updates the existing one on
      # subsequent runs (matched via the hidden marker). Skipped for PRs from
      # forks, whose read-only token cannot comment, and when there was nothing
      # to scan.
      - name: Comment report on PR
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && steps.report.outputs.skip_comment != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          marker='<!-- zizmor-findings-report -->'
          report="${RUNNER_TEMP}/zizmor-report.md"

          comment_id="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"${marker}\")) | .id" | head -n 1)"

          payload="$(jq -n --rawfile body "${report}" '{body: $body}')"
          if [[ -n "${comment_id}" ]]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
              --input - <<< "${payload}" > /dev/null
            echo "Updated existing report comment ${comment_id}"
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              --input - <<< "${payload}" > /dev/null
            echo "Created report comment"
          fi
