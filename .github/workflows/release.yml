name: release

on:
  workflow_dispatch:
    inputs:
      is_prerelease:
        description: Create a prerelease version
        type: boolean
        default: false

permissions: {}

# never run two releases at once; queue instead of cancelling so an
# in-flight tag push is not interrupted
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    name: Create version tag
    uses: c4a8/c4a8-code-reusable-actions/.github/workflows/semver-version.yml@f321371669a3ac3d19bf081e01ce57c9fae364d8 # semver-versioning-v3.0.1
    permissions:
      contents: write # create and push the version tag + GitHub release
    with:
      is_prerelease: ${{ inputs.is_prerelease }}
    environment: release
