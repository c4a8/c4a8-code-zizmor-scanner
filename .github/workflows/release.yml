name: release

on:
  workflow_dispatch:
    inputs:
      is_prerelease:
        description: Create a prerelease version
        type: boolean
        default: false

permissions: {}

# never run two releases at once; queue instead of cancelling so an
# in-flight tag push is not interrupted
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    name: Create version tag
    permissions:
      contents: write # create and push the version tag + GitHub release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      bump_type: ${{ steps.version.outputs.bump_type }}
      previous_tag: ${{ steps.version.outputs.previous_tag }}
      commit_subject: ${{ steps.version.outputs.commit_subject }}
    steps:
      - name: Generate semantic version
        id: version
        uses: glueckkanja/action-semantic-version@35b934d4dcec52abc5a3f49d9e60a51df9357730 # v4.0.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          is_prerelease: ${{ inputs.is_prerelease }}
