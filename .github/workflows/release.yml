name: release

on:
  # every push to main publishes a preview prerelease automatically
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      is_prerelease:
        description: Create a prerelease version
        type: boolean
        default: false

permissions: {}

# never run two releases at once; queue instead of cancelling so an
# in-flight tag push is not interrupted
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    name: Create version tag
    permissions:
      contents: write # create and push the version tag + GitHub release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      bump_type: ${{ steps.version.outputs.bump_type }}
      previous_tag: ${{ steps.version.outputs.previous_tag }}
      commit_subject: ${{ steps.version.outputs.commit_subject }}
    steps:
      - name: Generate semantic version
        id: version
        uses: glueckkanja/action-semantic-version@b413070dd1f039b1fbfda9f402dd52d602879fb3 # v5.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # push to main always yields a preview; manual runs follow the input
          is_prerelease: ${{ github.event_name == 'push' || inputs.is_prerelease }}
          # since v4 the action no longer appends a prerelease suffix on its
          # own. Without an explicit name a prerelease would claim the plain
          # vX.Y.Z tag and block the next stable release of that version, so
          # prereleases are always tagged vX.Y.Z-preview.N. Stable releases
          # pass an empty name to keep plain vX.Y.Z tags.
          prerelease_name: ${{ (github.event_name == 'push' || inputs.is_prerelease) && 'preview' || '' }}
